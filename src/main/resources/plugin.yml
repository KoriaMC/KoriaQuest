name: KoriaQuest
version: ${project.version}
main: fr.koriamc.quest.KoriaQuest
author: KoriaMC
description: ${project.description}
depend: [KoriaFactions]
softdepend: [Vault, PlaceholderAPI]

# La commande principale (/quests par défaut) et ses alias sont enregistrés dynamiquement
# depuis config.json : ils ne sont donc pas déclarés ici.

permissions:
  koriaquest.*:
    description: Accès complet à KoriaQuest
    default: op
    children:
      koriaquest.player: true
      koriaquest.admin: true
  koriaquest.player:
    description: Commandes joueur (les nœuds exacts sont définis dans config.json)
    default: true
  koriaquest.admin:
    description: Commandes d'administration (les nœuds exacts sont définis dans config.json)
    default: op
